<style>
:root{
  --amber:#A8560E; --amber-c:#FFDDB8; --green:#3E6B3A; --green-c:#C6E4BD;
  --gold:#C58A1E; --clay:#B4402E; --coffee:#4E342E;
  --bg:#FBF7F2; --surface:#FFFFFF; --surface-2:#F4EDE3; --surface-3:#EFE6D8;
  --on-bg:#211A13; --on-muted:#83725A; --outline:#DECDB0; --ring-track:#E7D9C2;
  --shadow:0 1px 2px rgba(60,40,15,.06),0 4px 16px rgba(60,40,15,.06);
  --shadow-lg:0 8px 32px rgba(60,40,15,.14);
  --r-xl:28px; --r-lg:20px; --r-md:16px; --r-sm:12px; --nav-h:72px;
  --font:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Roboto,sans-serif;
  --font-display:'Fraunces','Georgia',serif;
  --card-sheen:inset 0 1px 0 rgba(255,255,255,.55);
}
[data-theme="dark"]{
  --amber:#F5B15C; --amber-c:#5A3410; --green:#9CD08E; --green-c:#274C24;
  --gold:#E4B454; --clay:#F0937F; --coffee:#D8C3B8;
  --bg:#16120D; --surface:#211B14; --surface-2:#2A2219; --surface-3:#342A1F;
  --on-bg:#ECE3D5; --on-muted:#B7A891; --outline:#463A2B; --ring-track:#3A3024;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.35);
  --shadow-lg:0 8px 32px rgba(0,0,0,.5);
  --card-sheen:inset 0 1px 0 rgba(255,255,255,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);background:var(--bg);color:var(--on-bg);min-height:100dvh;
  overflow-x:hidden;overscroll-behavior-y:none;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  transition:background .3s,color .3s;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
.muted{color:var(--on-muted)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

.appbar{position:sticky;top:0;z-index:40;padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;
  background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;transition:box-shadow .2s}
.appbar.scrolled{box-shadow:0 1px 0 var(--outline),0 4px 14px rgba(60,40,15,.08)}
[data-theme="dark"] .appbar.scrolled{box-shadow:0 1px 0 var(--outline),0 4px 14px rgba(0,0,0,.3)}
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{width:38px;height:38px;border-radius:12px;background:radial-gradient(circle at 50% 62%,var(--green) 0 22%,var(--surface) 23% 40%,var(--amber) 41%);box-shadow:var(--shadow);flex:none}
.brand h1{font-family:var(--font-display);font-size:20px;font-weight:700;line-height:1}.brand small{font-size:11px;color:var(--on-muted);letter-spacing:.03em}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);font-size:20px;transition:transform .15s}
.icon-btn:active{transform:scale(.9)}
.screen{padding:4px 16px 24px;max-width:560px;margin:0 auto}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.stagger{animation:cardIn .36s cubic-bezier(.2,.8,.2,1) both}
.hide{display:none!important}

.card{background:var(--surface);border:1px solid var(--outline);border-radius:var(--r-lg);box-shadow:var(--shadow),var(--card-sheen);padding:18px}
.card-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--on-muted);margin-bottom:14px}
.hero{background:linear-gradient(150deg,var(--amber-c),var(--surface) 78%);border:1px solid var(--outline);border-radius:var(--r-xl);padding:22px;box-shadow:var(--shadow),var(--card-sheen);margin-bottom:14px}
.hero-row{display:flex;align-items:center;gap:20px}
.ring-wrap{position:relative;flex:none}
.ring-wrap .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring-num{font-family:var(--font-display);font-size:25px;font-weight:700;line-height:1;letter-spacing:-.01em}
.ring-lbl{font-size:11px;color:var(--on-muted);letter-spacing:.04em;margin-top:2px}
.ring-pct{font-size:10px;font-weight:800;color:var(--amber);margin-top:4px;letter-spacing:.04em}
.hero-stats{flex:1;display:flex;flex-direction:column;gap:12px}
.hs{display:flex;justify-content:space-between;align-items:baseline}.hs b{font-size:20px}.hs span{font-size:12px;color:var(--on-muted)}
.hs.eaten b{color:var(--amber)}
.mini-eq{font-size:12px;color:var(--on-muted);margin-top:14px;text-align:center;border-top:1px solid var(--outline);padding-top:12px}
[data-theme="dark"] .hero{background:linear-gradient(155deg,#3B2612 0%,var(--surface) 66%)}
.ring-num,.big,.hs b,.macro b,.stat .v,.meal-head .kc,.goal-card .big{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.day-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 0 14px}
.day-head .greet{font-family:var(--font-display);font-size:23px;font-weight:700;letter-spacing:-.01em}
.day-head .date{font-size:13px;color:var(--on-muted);margin-top:2px}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.macro{background:var(--surface);border:1px solid var(--outline);border-radius:var(--r-md);padding:13px 8px 12px;text-align:center;box-shadow:var(--shadow),var(--card-sheen);cursor:pointer;transition:transform .12s}
.macro:active{transform:scale(.96)}
.macro .bar{height:6px;border-radius:99px;background:var(--ring-track);overflow:hidden;margin:8px 4px 7px}
.macro .bar>i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.macro b{font-size:16px;font-weight:800}.macro small{font-size:10.5px;color:var(--on-muted);display:block;text-transform:uppercase;letter-spacing:.05em}
.macro .g{font-size:10px;color:var(--on-muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--outline);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow),var(--card-sheen);position:relative;overflow:hidden}
.stat .k{font-size:12px;color:var(--on-muted);display:flex;align-items:center;gap:6px}
.stat .v{font-family:var(--font-display);font-size:25px;font-weight:700;margin-top:6px}.stat .v small{font-family:var(--font);font-size:12px;font-weight:600;color:var(--on-muted)}
.stat .sub{font-size:11px;color:var(--on-muted);margin-top:2px}
.water-card{margin-bottom:14px}
.water-btns{display:flex;gap:8px}
.wbtn{flex:1;background:var(--surface-2);border-radius:13px;padding:11px 4px;text-align:center;font-size:12.5px;font-weight:700;line-height:1.5;transition:transform .12s}
.wbtn:active{transform:scale(.93)}
.wbtn.neg{color:var(--clay)}
.quick-row{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.quick-row::-webkit-scrollbar{display:none}
.qa{flex:none;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:11px 12px;display:flex;align-items:center;gap:8px;min-width:112px}
.qa:active{transform:scale(.96)}.qa .qe{font-size:20px}.qa .qt b{font-size:13px;display:block;max-width:88px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qa .qt small{font-size:11px;color:var(--amber);font-weight:700}
.meal{background:var(--surface);border:1px solid var(--outline);border-radius:var(--r-lg);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.meal-head{display:flex;align-items:center;gap:12px;padding:15px 16px}
.meal-emoji{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:20px;flex:none}
.meal-head .t{flex:1}.meal-head .t b{font-size:15px}.meal-head .t small{font-size:12px;color:var(--on-muted)}
.meal-head .kc{font-size:14px;font-weight:800;color:var(--amber)}
.add-btn{width:34px;height:34px;border-radius:50%;background:var(--amber-c);color:var(--amber);font-size:22px;font-weight:700;display:grid;place-items:center;flex:none;transition:transform .15s}
.add-btn:active{transform:scale(.85) rotate(90deg)}
.swipe-wrap{position:relative;overflow:hidden;border-top:1px solid var(--outline)}
.swipe-del{position:absolute;inset:0;background:var(--clay);display:flex;align-items:center;justify-content:flex-end;padding-right:22px;color:#fff;font-size:20px;opacity:0}
.log-item{display:flex;align-items:center;gap:10px;padding:11px 16px;background:var(--surface);position:relative;will-change:transform}
.log-item .li-t{flex:1;min-width:0}
.log-item .li-t b{font-size:14px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-item .li-t small{font-size:11.5px;color:var(--on-muted)}
.log-item .li-k{font-size:13px;font-weight:700}
.li-chev{color:var(--on-muted);font-size:15px;padding-left:2px}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:45;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);background:var(--surface);
  box-shadow:0 -1px 0 var(--outline),0 -8px 24px rgba(60,40,15,.06);display:flex;justify-content:space-around;align-items:stretch}
[data-theme="dark"] .bottomnav{box-shadow:0 -1px 0 var(--outline),0 -8px 24px rgba(0,0,0,.4)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--on-muted);font-size:11px;font-weight:600;position:relative}
.nav-item .ni{font-size:22px;line-height:1;transition:transform .2s}
.nav-item.active{color:var(--amber)}.nav-item.active .ni{transform:translateY(-2px) scale(1.08)}
.nav-item.active::before{content:"";position:absolute;top:8px;width:44px;height:30px;border-radius:99px;background:var(--amber-c);z-index:-1}
.fab-slot{flex:0 0 64px;position:relative}
.fab{position:absolute;top:-22px;left:50%;transform:translateX(-50%);width:60px;height:60px;border-radius:20px;
  background:linear-gradient(145deg,var(--amber),var(--gold));color:#fff;font-size:30px;font-weight:300;
  display:grid;place-items:center;box-shadow:0 8px 20px rgba(168,86,14,.45);transition:transform .18s}
.fab:active{transform:translateX(-50%) scale(.9)}
.scrim{position:fixed;inset:0;background:rgba(20,12,4,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .28s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--surface);border-radius:26px 26px 0 0;
  max-height:92dvh;display:flex;flex-direction:column;transform:translateY(101%);
  transition:transform .32s cubic-bezier(.2,.9,.25,1);box-shadow:var(--shadow-lg);max-width:560px;margin:0 auto}
.sheet.show{transform:translateY(0)}
.sheet-grab{width:36px;height:5px;border-radius:99px;background:var(--outline);margin:12px auto 4px;flex:none}
.sheet-head{padding:6px 20px 12px;display:flex;align-items:center;gap:10px}.sheet-head h3{font-size:18px;flex:1}
.sheet-body{overflow-y:auto;padding:0 16px 24px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.search{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:16px;padding:12px 15px;margin:0 4px 12px}
.search input{flex:1;border:none;background:none;font-size:16px;color:inherit;outline:none;min-width:0}
.mic{width:34px;height:34px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:16px;flex:none}
.mic.rec{background:var(--clay);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.tool-row{display:flex;gap:8px;padding:0 4px 12px}
.tool{flex:1;background:var(--surface-2);border-radius:14px;padding:12px 6px;text-align:center;font-size:12px;font-weight:700;display:flex;flex-direction:column;gap:4px;align-items:center}
.tool .ti{font-size:20px}.tool:active{transform:scale(.96)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 4px 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 14px;border-radius:99px;background:var(--surface-2);font-size:13px;font-weight:600;color:var(--on-muted);flex:none;border:1.5px solid transparent}
.chip.on{background:var(--green-c);color:var(--green)}
.food-row{display:flex;align-items:center;gap:12px;padding:12px 8px;border-radius:14px;border-bottom:1px solid var(--outline)}
.food-row:active{background:var(--surface-2)}
.food-emoji{width:42px;height:42px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:21px;flex:none}
.food-row .fr-t{flex:1;min-width:0}.food-row .fr-t b{font-size:15px;display:block}.food-row .fr-t small{font-size:12px;color:var(--on-muted)}
.food-row .fr-k{text-align:right;font-size:13px}.food-row .fr-k b{color:var(--amber)}
.section-lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--on-muted);padding:16px 8px 6px}
.portion-hero{display:flex;align-items:center;gap:14px;padding:8px 8px 12px}
.portion-hero .pe{width:56px;height:56px;border-radius:16px;background:var(--surface-2);display:grid;place-items:center;font-size:28px}
.meal-chips{display:flex;gap:8px;overflow-x:auto;padding:2px 4px 12px;scrollbar-width:none}.meal-chips::-webkit-scrollbar{display:none}
.qty-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:4px 4px 10px}
.qty{padding:13px 6px;border-radius:14px;background:var(--surface-2);text-align:center;font-size:13px;font-weight:600;border:2px solid transparent;transition:transform .1s}
.qty:active{transform:scale(.95)}.qty.on{background:var(--amber-c);color:var(--amber);border-color:var(--amber)}
.qty small{display:block;font-size:10.5px;color:var(--on-muted);margin-top:2px}.qty.on small{color:var(--amber)}
.custom-g{display:flex;gap:8px;align-items:center;padding:4px 4px 12px}
.custom-g input{flex:1;background:var(--surface-2);border:none;border-radius:12px;padding:13px;font-size:16px;color:inherit;text-align:center;font-weight:700}
.macro-preview{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px 4px}
.mp{background:var(--surface-2);border-radius:12px;padding:11px 4px;text-align:center}
.mp b{font-size:16px;display:block}.mp small{font-size:10px;color:var(--on-muted);text-transform:uppercase}.mp.kc b{color:var(--amber)}
.btn{width:100%;padding:16px;border-radius:16px;font-size:16px;font-weight:700;text-align:center;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--amber);color:#fff;box-shadow:0 6px 16px rgba(168,86,14,.35)}
.btn-tonal{background:var(--surface-2);color:var(--on-bg)}
.btn-danger{background:transparent;color:var(--clay);border:1.5px solid var(--clay)}
.btn-row{display:flex;gap:10px;padding:6px 4px 4px}.btn-row .btn{flex:1}
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px;margin:0 0 12px}
.seg button{flex:1;padding:11px;border-radius:11px;font-size:13px;font-weight:700;color:var(--on-muted)}
.seg button.on{background:var(--surface);color:var(--amber);box-shadow:var(--shadow)}
.chart-card{background:var(--surface);border:1px solid var(--outline);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--on-muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.micro-row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--outline)}
.micro-row .mn{flex:1;font-size:14px;font-weight:600}.micro-row .mbar{width:90px;height:7px;border-radius:99px;background:var(--ring-track);overflow:hidden}
.micro-row .mbar>i{display:block;height:100%;background:var(--green);border-radius:99px}
.micro-row .mv{font-size:12px;color:var(--on-muted);width:80px;text-align:right}
.wk-stat{display:flex;justify-content:space-between;padding:13px 4px;border-bottom:1px solid var(--outline);font-size:14px}.wk-stat b{font-weight:800}
.field{margin:14px 0}
.field label{font-size:12px;font-weight:700;color:var(--on-muted);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:7px}
.field input,.field select{width:100%;background:var(--surface-2);border:none;border-radius:14px;padding:15px;font-size:16px;color:inherit;outline:none}
.chip-select{display:flex;gap:8px;flex-wrap:wrap}
.chip-select button{padding:11px 16px;border-radius:14px;background:var(--surface-2);font-size:14px;font-weight:600;border:2px solid transparent}
.chip-select button.on{background:var(--amber-c);color:var(--amber);border-color:var(--amber)}
.goal-card{background:linear-gradient(150deg,var(--green-c),var(--surface) 80%);border:1px solid var(--outline);border-radius:var(--r-lg);padding:18px;margin:14px 0;text-align:center}
.goal-card .big{font-family:var(--font-display);font-size:38px;font-weight:700;color:var(--amber)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px);transform:translateX(-50%) translateY(14px) scale(.92);
  background:var(--coffee);color:#fff;padding:13px 20px;border-radius:14px;font-size:14px;font-weight:600;z-index:80;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .4s cubic-bezier(.34,1.56,.64,1);box-shadow:var(--shadow-lg);max-width:90vw;display:flex;gap:14px;align-items:center}
[data-theme="dark"] .toast{background:var(--surface-3);color:var(--on-bg)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1);pointer-events:auto}
.toast button{color:var(--amber);font-weight:800;font-size:14px}
.empty{text-align:center;color:var(--on-muted);padding:40px 20px;font-size:14px}
.empty .e-emoji{font-size:44px;margin-bottom:10px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--green-c);color:var(--green)}
.link{color:var(--amber);font-weight:700;font-size:14px}
.row-between{display:flex;justify-content:space-between;align-items:center}
.install-banner{margin:0 4px 12px;background:var(--surface);border:1.5px solid var(--amber);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.install-banner .ib-t{flex:1;font-size:13px}.install-banner .ib-t b{font-size:14px}
.scanner-video{width:100%;border-radius:16px;background:#000;aspect-ratio:4/3;object-fit:cover}
.scan-frame{position:relative}
.scan-line{position:absolute;left:8%;right:8%;height:2px;background:var(--clay);box-shadow:0 0 8px var(--clay);top:50%;animation:scan 2s ease-in-out infinite}
@keyframes scan{0%,100%{top:22%}50%{top:78%}}
.spinner{width:26px;height:26px;border:3px solid var(--outline);border-top-color:var(--amber);border-radius:50%;animation:spin 1s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.toggle{width:48px;height:28px;border-radius:99px;position:relative;transition:background .2s;flex:none}
.toggle>i{position:absolute;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
</style>

/* ---- Profiles: Aswath and Surekaa keep fully independent data on the same
   device — same idea as the workout app's per-profile prefix, adapted for
   this app's flat store.get/set (see profileKeyPrefix below). ---- */
const PROFILES=[{id:'aswath',label:'Aswath'},{id:'surekaa',label:'Surekaa'}];
const isProfileId=v=>PROFILES.some(p=>p.id===v);
const profileLabel=id=>(PROFILES.find(p=>p.id===id)||{}).label||id;
const profileKeyPrefix=id=>`sp_${id}_`;
function rawGet(k,def){try{const v=localStorage.getItem(k);return v==null?def:JSON.parse(v);}catch(e){return def;}}
function rawSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
let activeProfileId=rawGet('activeProfile',null);
if(!isProfileId(activeProfileId))activeProfileId=null;

// Every key store.get/set ever touched before profiles existed — migrated into
// whichever profile is chosen first on this device, so nobody's existing log
// gets silently dropped by the upgrade.
const LEGACY_KEYS=['aiKey','aiModel','customFoods','days','dietPref','favs','freq','haptics','installDismiss','migWaterMl','profile','recent','reminders','theme','weights'];
function migrateLegacyDataTo(id){
  const prefix=profileKeyPrefix(id);
  LEGACY_KEYS.forEach(k=>{const v=localStorage.getItem(k);if(v!=null){localStorage.setItem(prefix+k,v);localStorage.removeItem(k);}});
}
function chooseProfile(id){migrateLegacyDataTo(id);rawSet('activeProfile',id);location.reload();}
function switchProfile(id){rawSet('activeProfile',id);location.reload();}

const mem={};
let storageOK=true, storageWarned=false;
function warnStorageOnce(){if(storageWarned)return;storageWarned=true;try{toast('⚠️ Storage is blocked — turn off Private Browsing so your log is saved');}catch(e){}}
const store={
  get(k,def){const key=activeProfileId?profileKeyPrefix(activeProfileId)+k:k;try{const v=localStorage.getItem(key);if(v==null)return (key in mem)?mem[key]:def;return JSON.parse(v);}catch(e){return (key in mem)?mem[key]:def;}},
  set(k,v){const key=activeProfileId?profileKeyPrefix(activeProfileId)+k:k;try{localStorage.setItem(key,JSON.stringify(v));}catch(e){mem[key]=v;storageOK=false;warnStorageOnce();}}
};
function initStorage(){
  try{const k='__sappadu_probe__';localStorage.setItem(k,'1');storageOK=localStorage.getItem(k)==='1';localStorage.removeItem(k);}
  catch(e){storageOK=false;}
  if(storageOK&&navigator.storage&&navigator.storage.persist){
    navigator.storage.persisted().then(p=>{if(!p)return navigator.storage.persist();}).catch(()=>{});
  }
}
async function storageStatus(){let persisted=false,usage=null;
  try{if(navigator.storage){if(navigator.storage.persisted)persisted=await navigator.storage.persisted();
    if(navigator.storage.estimate){const e=await navigator.storage.estimate();usage=e.usage;}}}catch(e){}
  return {ok:storageOK,persisted,usage};}
function migrateWaterToMl(){
  if(store.get('migWaterMl',false))return;
  const days=store.get('days',{});let changed=false;
  Object.keys(days).forEach(k=>{const d=days[k];if(d&&typeof d.water==='number'&&d.water>0&&d.water<50){d.water=d.water*250;changed=true;}});
  if(changed)store.set('days',days);
  store.set('migWaterMl',true);
}
// Old goal scheme (loss/maintain/lean/gain/custom) -> new one that matches the
// workout app's Recomposition / Fat Loss Focus / Build Muscle framing.
// No run-once flag needed (unlike migrateWaterToMl) — GOAL_MIGRATION only ever
// remaps old string values, so running this again on already-migrated data (or
// on a profile pulled from the cloud) is a safe no-op.
const GOAL_MIGRATION={loss:'fatloss',lean:'muscle',gain:'muscle'};
function migrateGoalScheme(){
  const p=store.get('profile',null);
  if(p&&GOAL_MIGRATION[p.goal]){p.goal=GOAL_MIGRATION[p.goal];store.set('profile',p);}
}
const todayKey=(d=new Date())=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10);};
const fmt=n=>Math.round(n||0).toLocaleString('en-IN');
function timeAgo(ms){const s=Math.max(0,Math.round((Date.now()-ms)/1000));
  if(s<60)return'just now';if(s<3600)return Math.round(s/60)+'m ago';if(s<86400)return Math.round(s/3600)+'h ago';return Math.round(s/86400)+'d ago';}
function haptic(p=8){ if(store.get('haptics',true)&&navigator.vibrate){try{navigator.vibrate(p);}catch(e){}} }

const DIET_RANK={veg:0,egg:1,nonveg:2};
function dietAllowed(foodDiet,pref){

  return (DIET_RANK[foodDiet]??2)<=(DIET_RANK[pref]??2);
}

function portionsFor(f){
  const g=f.gPerUnit;
  switch(f.unit){
    case 'pc':   return [["½ pc",g*0.5],["1 pc",g],["2 pc",g*2],["3 pc",g*3],["4 pc",g*4],["1 g",1]];
    case 'slice':return [["½ slice",g*0.5],["1 slice",g],["2 slice",g*2],["1 g",1]];
    case 'bowl': return [["Small bowl",150],["Medium bowl",250],["Large bowl",350],["Cup",120],["1 g",1]];
    case 'glass':return [["Cup",120],["Glass",200],["Large glass",300],["1 ml",1]];
    case 'tbsp': return [["1 tsp",5],["1 tbsp",15],["2 tbsp",30],["Small bowl",50],["1 g",1]];
    case 'hand': return [["1 tbsp",10],["Handful",30],["2 handful",60],["1 g",1]];
    case 'scoop':{const gg=f.gPerUnit||30;return [["1 scoop",gg],["2 scoops",2*gg],["½ scoop",gg/2],["1 g",1]];}
    case 'pack': return [["1 serving",g||30],["30 g",30],["50 g",50],["100 g",100],["1 g",1]];
    case 'custom':{const L=f.servingLabel||'serving';return [["1 "+L,g],["2 "+L,2*g],["½ "+L,g/2],["1 g",1]];}
    default:     return [["100 g",100],["1 g",1]];
  }
}
function computeMacros(f,grams){const k=grams/100,m={};for(const key in f.per100)m[key]=f.per100[key]*k;return m;}
function defaultPortion(f){const ps=portionsFor(f);let i=ps.findIndex(p=>/^1 /.test(p[0])&&!/^1 (g|ml)$/.test(p[0]));if(i<0)i=1;return ps[i]||ps[0];}
// Scales a portion's label along with its grams (e.g. "1 pc" x3 grams -> "3 pc")
// instead of falling back to a raw gram count that would read redundantly next
// to logRow's own "portion · Xg" display. Used when auto-filling a day, where
// the picked portion is resized to fit the meal's remaining budget.
function scalePortionLabel(dp,grams){
  const [label,defaultGrams]=dp;
  if(Math.abs(grams-defaultGrams)<0.5)return label;
  const m=label.match(/^(\d+(?:\.\d+)?|½|¾|¼)\s+(.+)$/);
  if(m&&!/^(g|ml)$/.test(m[2])){
    const baseCount=({'½':0.5,'¾':0.75,'¼':0.25})[m[1]]??parseFloat(m[1]);
    const count=Math.round((baseCount*grams/defaultGrams)*2)/2;
    return `${count} ${m[2]}`;
  }
  return Math.round(grams)+' g';
}

// Tries this device's own localStorage first (works instantly if the two of
// you share one device), and only falls back to a read-only cloud peek if
// that's empty and Firebase is configured — never writes anything, never
// switches identity.
async function getPartnerSnapshot(){
  const other=PROFILES.find(x=>x.id!==activeProfileId).id,prefix=profileKeyPrefix(other);
  let daysRaw=localStorage.getItem(prefix+'days'),profileRaw=localStorage.getItem(prefix+'profile');
  if((!daysRaw||!profileRaw)&&isFirebaseConfigured){
    const remote=await peekProfile(other);
    if(remote){daysRaw=daysRaw||remote[prefix+'days'];profileRaw=profileRaw||remote[prefix+'profile'];}
  }
  if(!daysRaw||!profileRaw)return null;
  try{
    const days=JSON.parse(daysRaw),profile=JSON.parse(profileRaw);
    const today=days[todayKey()]||{log:[],type:'train'};
    const eaten=today.log.reduce((a,x)=>a+x.m.kcal,0);
    const g=calcGoals(profile,today.type||'train');
    return {id:other,label:profileLabel(other),eaten,goal:g.cal,streak:streakFromDays(days)};
  }catch(e){return null;}
}
function weightHistory(){return store.get('weights',[]);}

// Same philosophy as the workout app's goal system: Recomposition is a MILD
// deficit (10-15% below maintenance, not an aggressive cut) since the point is
// losing fat and building muscle at once; Fat Loss Focus takes a real deficit;
// Build Muscle runs a lean surplus. Deficits/surplus scale with TDEE (% based)
// rather than a flat kcal number, so they stay reasonable at any body size.
// Protein follows the same 1.6-2.2 g/kg range, biased toward the top of it for
// goals that lean on protein most (recomp, muscle) per that same reasoning.
const GOAL_ADJ_PCT={maintain:0,recomp:-0.12,fatloss:-0.20,muscle:0.12,custom:0};
const GOAL_PROTEIN_PER_KG={maintain:1.6,recomp:2.0,fatloss:1.8,muscle:2.2,custom:1.8};
function calcGoals(p,dayType){
  const activity=dayType==='rest'?Math.max(1.2,p.activity-0.15):p.activity;
  const s=p.gender==='male'?5:-161;
  const bmr=10*p.weight+6.25*p.height-5*p.age+s;
  const tdee=bmr*activity;
  const pct=GOAL_ADJ_PCT[p.goal]??0;
  let cal=Math.round((tdee*(1+pct))/10)*10;
  if(p.goal==='custom'&&p.customCal)cal=dayType==='rest'?Math.max(Math.round(bmr),p.customCal-300):p.customCal;
  const protein=Math.round(p.weight*(GOAL_PROTEIN_PER_KG[p.goal]??1.6));
  const fat=Math.round(cal*0.25/9);
  const carbs=Math.round((cal-protein*4-fat*9)/4);
  return {cal,protein,carbs,fat,fibre:30,water:waterTargetMl(p),tdee:Math.round(tdee),bmr:Math.round(bmr)};
}
function waterTargetMl(p){return Math.round(p.weight*35/100)*100;}
function fmtL(ml){const l=Math.round((ml||0)/10)/100;return (Number.isInteger(l)?l.toFixed(1):l.toFixed(2)).replace(/0$/,'').replace(/\.$/,'.0');}

/* ---- "What should I eat?" suggestions ----
   Ranks foods (at their default portion) by protein-per-calorie so the list
   naturally leads with whatever closes the day's biggest usual gap — protein
   — first. Portions far past what's left on the calorie budget are dropped,
   with a small floor so something always shows even once you're near/over. */
function rankByProteinDensity(pool,remaining,limit=15){
  const kcalCap=Math.max(remaining.kcal,100)*1.3;
  return pool
    .map(f=>{const dp=defaultPortion(f);const m=computeMacros(f,dp[1]);return {f,dp,m};})
    .filter(x=>x.m.kcal>0&&x.m.kcal<=kcalCap)
    .sort((a,b)=>(b.m.p/b.m.kcal)-(a.m.p/a.m.kcal))
    .slice(0,limit);
}
function suggestFoods(remaining,diet,limit=15){
  return rankByProteinDensity(allFoods().filter(f=>dietAllowed(f.diet,diet)),remaining,limit);
}
// Same ranking, but tries foods tagged for this meal first (breakfast items for
// Breakfast, etc. — same category convention as the Add Food filter) and only
// falls back to the full pool if nothing in that category fits. Used by the
// day auto-fill/simulation below, where meal-appropriateness matters more than
// it does for the single "what should I eat right now" list.
function suggestForMeal(remaining,diet,mealName,limit=8){
  const dietPool=allFoods().filter(f=>dietAllowed(f.diet,diet));
  const catPool=dietPool.filter(f=>f.cat===mealName||(mealName==='Dinner'&&f.cat==='Lunch'));
  return rankByProteinDensity(catPool.length?catPool:dietPool,remaining,limit);
}
// Simulates a full day of eating to hit tomorrow's (or any day's) target —
// greedily fills each meal slot with the top-ranked pick for whatever's left
// of that meal's share of the day's remaining calories/macros, same idea as
// "What should I eat?" but run automatically across a whole day instead of
// one gap. Every meal gets at most 3 items so it reads like a real day, not
// a grocery list. Writes straight into that date's log — since it uses the
// exact same log entries as manually-added food, planning tomorrow IS
// tomorrow's diary; open it, tweak/swap anything, or leave it as your plan.
const AUTO_FILL_MEALS=[['Breakfast',0.25],['Lunch',0.35],['Dinner',0.30],['Snacks',0.10]];
function autoFillDay(date){
  const dd=dayData(date),dtype=dd.type||'train',g=calcGoals(state.profile,dtype),diet=dietPref();
  const tot=dd.log.reduce((a,x)=>({kcal:a.kcal+x.m.kcal,p:a.p+x.m.p,c:a.c+x.m.c,f:a.f+x.m.f}),{kcal:0,p:0,c:0,f:0});
  const dayGap={kcal:Math.max(0,g.cal-tot.kcal),p:Math.max(0,g.protein-tot.p),c:Math.max(0,g.carbs-tot.c),f:Math.max(0,g.fat-tot.f)};
  // No dish twice in one auto-filled day, and steer away from what the previous
  // day had too — otherwise the top-ranked pick for a given meal/diet/budget is
  // the same food every time, so back-to-back auto-filled days would look
  // identical. Picking randomly among the top few fits (not always #1) is what
  // actually gives day-to-day variety; avoiding yesterday's dishes on top of
  // that keeps it from just alternating between the same two options.
  const yesterday=dayData(todayKey(new Date(new Date(date).getTime()-864e5)));
  const usedIds=new Set([...dd.log.map(x=>x.id),...yesterday.log.map(x=>x.id)]);
  AUTO_FILL_MEALS.forEach(([name,weight],mi)=>{
    let rem={kcal:dayGap.kcal*weight,p:dayGap.p*weight,c:dayGap.c*weight,f:dayGap.f*weight};
    for(let i=0;i<4&&rem.kcal>80;i++){
      let picks=suggestForMeal(rem,diet,name).filter(x=>!usedIds.has(x.f.id));
      if(!picks.length)picks=suggestForMeal(rem,diet,name); // yesterday's foods are fine again if nothing else fits
      if(!picks.length)break;
      const {f,dp}=picks[Math.floor(Math.random()*Math.min(picks.length,4))];
      // Ranking picks the food at its default portion, but a single default
      // serving (say, one idli) is usually far smaller than a meal's whole
      // budget — scale the portion up to actually fill most of what's left
      // (never below the default serving, capped at a flat realistic max — a
      // multiple of the default portion isn't safe here since default sizes
      // range from ~10g garnishes to 350g bowls) rather than always logging
      // the smallest serving and needing an unrealistic item count.
      const perGramKcal=f.per100.kcal/100;
      const grams=perGramKcal>0?Math.max(dp[1],Math.min((rem.kcal*0.8)/perGramKcal,450)):dp[1];
      const m=computeMacros(f,grams);
      const portion=scalePortionLabel(dp,grams);
      dd.log.push({uid:Date.now()+''+Math.random()+mi+i,id:f.id,name:f.name,emoji:f.emoji,meal:name,portion,grams,m});
      usedIds.add(f.id);
      rem={kcal:rem.kcal-m.kcal,p:rem.p-m.p,c:rem.c-m.c,f:rem.f-m.f};
    }
  });
  saveDay(date,dd);
}

const $=(s,el=document)=>el.querySelector(s);
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild;};
let toastTimer;
function toast(msg,action){
  const t=$('#toast');t.innerHTML='';t.appendChild(document.createTextNode(msg));
  if(action){const b=el(`<button>${action.label}</button>`);b.onclick=()=>{action.fn();t.classList.remove('show');};t.appendChild(b);}
  t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),action?4200:2200);
}
function ringSVG(pct,size,color,stroke,grad){pct=Math.max(0,Math.min(1,pct));const r=(size-stroke)/2,c=2*Math.PI*r,off=c*(1-pct);
  const id='rg'+Math.random().toString(36).slice(2,7);const sv=grad?`url(#${id})`:color;
  const defs=grad?`<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:${grad[0]}"/><stop offset="1" style="stop-color:${grad[1]}"/></linearGradient></defs>`:'';
  const glow=pct>0.02?`filter:drop-shadow(0 0 3px ${grad?grad[1]:color});`:'';
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">${defs}
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--ring-track)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${sv}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" style="${glow}transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)"/></svg>`;}

  scr.appendChild(el(`<div class="day-head"><div><div class="greet">${greet}</div><div class="date">${now.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'short'})}</div></div>${d.log.length?`<div class="pill">${d.log.length} item${d.log.length>1?'s':''} logged</div>`:''}</div>`));

  seg.children[1].onclick=()=>{haptic();const dd=dayData();dd.type='rest';saveDay(state.date,dd);render();};
  scr.appendChild(seg);
  const pctG=Math.round(tot.kcal/g.cal*100),over=remaining<0;
  const ringGrad=over?['#E0724F','var(--clay)']:['var(--gold)','var(--amber)'];
  scr.appendChild(el(`<div class="hero"><div class="hero-row">
    <div class="ring-wrap">${ringSVG(tot.kcal/g.cal,122,'var(--amber)',11,ringGrad)}
      <div class="center"><div class="ring-num">${over?fmt(-remaining):fmt(Math.max(0,remaining))}</div><div class="ring-lbl">${over?'kcal over':'kcal left'}</div><div class="ring-pct" style="${over?'color:var(--clay)':''}">${pctG}% of goal</div></div></div>
    <div class="hero-stats"><div class="hs eaten"><b>${fmt(tot.kcal)}</b><span>eaten</span></div>
      <div class="hs"><b>${fmt(g.cal)}</b><span>goal</span></div><div class="hs"><b>${streak()}</b><span>🔥 streak</span></div></div></div>
    <div class="mini-eq">${dtype==='rest'?'😴 Rest-day target · ':''}${over?`⚠️ ${fmt(-remaining)} kcal over goal`:`Goal ${fmt(g.cal)} − Food ${fmt(tot.kcal)} = ${fmt(remaining)} left`}</div></div>`));

  const mg=el(`<div class="macros"></div>`);
  [['Protein','p',tot.p,g.protein,'var(--green)'],['Carbs','c',tot.c,g.carbs,'var(--gold)'],['Fat','f',tot.f,g.fat,'var(--clay)'],['Fibre','fib',tot.fib,g.fibre,'var(--amber)']].forEach(([n,key,v,goal,col])=>{
    const card=el(`<div class="macro"><small>${n}</small><div class="bar"><i style="width:${Math.min(100,v/goal*100)}%;background:${col}"></i></div>

    card.onclick=()=>{haptic();openMacroSheet(n,key,goal,col);};

  const suggestCard=el(`<div class="card" style="margin-bottom:14px;display:flex;align-items:center;gap:14px">

  scr.appendChild(water);

function logRow(it){
  const wrap=el(`<div class="swipe-wrap"><div class="swipe-del">🗑️</div>
    <div class="log-item"><div class="food-emoji" style="width:34px;height:34px;font-size:17px">${it.emoji}</div>

  attachSwipe(item,()=>{haptic(20);const dd=dayData();dd.log=dd.log.filter(x=>x.uid!==it.uid);saveDay(state.date,dd);render();toast(`Removed ${it.name}`);});
  item.addEventListener('click',()=>{if(item._moved)return;const f=foodById(it.id);if(f)openPortionSheet(f,it.meal,it.uid);});

function attachSwipe(item,onDelete){
  let x0,y0,dx=0,drag=false,decided=false,horiz=false;const del=item.previousElementSibling;
  item.addEventListener('touchstart',e=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY;dx=0;drag=true;decided=false;horiz=false;item._moved=false;item.style.transition='none';},{passive:true});
  item.addEventListener('touchmove',e=>{if(!drag)return;const t=e.touches[0];dx=t.clientX-x0;const dy=t.clientY-y0;
    if(!decided){decided=Math.abs(dx)>6||Math.abs(dy)>6;horiz=Math.abs(dx)>Math.abs(dy);}
    if(decided&&horiz){e.preventDefault();item._moved=true;const d=Math.min(0,dx);item.style.transform=`translateX(${d}px)`;if(del)del.style.opacity=Math.min(1,-d/90);}},{passive:false});
  item.addEventListener('touchend',()=>{if(!drag)return;drag=false;item.style.transition='transform .2s';
    if(horiz&&dx<-95){item.style.transform='translateX(-100%)';setTimeout(onDelete,180);}else{item.style.transform='';if(del)del.style.opacity=0;}
    setTimeout(()=>{item._moved=false;},50);});
}

// In-app replacement for window.confirm() — native confirm/alert/prompt are
// unreliable (often silently a no-op, with no dialog and no error) once the
// app is installed to a home screen and running standalone, on iOS Safari in
// particular. Every destructive action needs an actual confirmation UI that
// works there too, so this is the one place any of them should go through.
function confirmSheet(message,onConfirm,opts={}){
  const sheet=el(`<div class="sheet"><div class="sheet-grab"></div>
    <div class="sheet-body" style="padding-top:6px">
      <div style="font-size:15px;font-weight:600;padding:10px 6px 20px;text-align:center">${message}</div>

    </div></div>`);
  sheet.querySelector('#ok').onclick=()=>{closeSheet();onConfirm();};
  sheet.querySelector('#cancel').onclick=closeSheet;
  openSheet(sheet);
}

/* -------- Barcode scanner (BarcodeDetector + Open Food Facts) -------- */
async function openScanner(meal){
  const supported='BarcodeDetector'in window;
  const sheet=el(`<div class="sheet"><div class="sheet-grab"></div>
    <div class="sheet-head"><h3 style="flex:1">Scan barcode</h3><button class="icon-btn" id="cls">✕</button></div>
    <div class="sheet-body">
      <div id="scanArea"></div>
      <div class="card-title" style="padding:16px 4px 6px">Or enter barcode</div>
      <div class="custom-g"><input id="code" inputmode="numeric" placeholder="e.g. 8901234567890"><button class="btn btn-tonal" id="go" style="width:auto;padding:13px 18px">Look up</button></div>
      <div id="scanMsg" class="muted" style="font-size:12px;padding:6px 4px"></div></div></div>`);
  sheet.querySelector('#cls').onclick=closeSheet;
  const area=sheet.querySelector('#scanArea'),msg=sheet.querySelector('#scanMsg');
  sheet.querySelector('#go').onclick=()=>{const c=sheet.querySelector('#code').value.trim();if(c)lookupBarcode(c,meal,msg);};
  openSheet(sheet);
  if(supported){
    area.innerHTML=`<div class="scan-frame"><video class="scanner-video" id="vid" playsinline muted></video><div class="scan-line"></div></div>`;
    try{
      activeStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      const vid=area.querySelector('#vid');vid.srcObject=activeStream;await vid.play();
      const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});
      let done=false;
      const loop=async()=>{if(done||!activeStream)return;
        try{const codes=await det.detect(vid);if(codes.length){done=true;haptic(20);stopStream();lookupBarcode(codes[0].rawValue,meal,msg);return;}}catch(e){}
        requestAnimationFrame(loop);};
      requestAnimationFrame(loop);
    }catch(e){area.innerHTML=`<div class="empty"><div class="e-emoji">📷</div>Camera not available.<br>Enter the barcode number below.</div>`;}
  } else {
    area.innerHTML=`<div class="empty"><div class="e-emoji">📷</div>Live scanning needs Chrome on Android.<br>On other devices, type the barcode below — lookup still works.</div>`;
  }
}
async function lookupBarcode(code,meal,msg){
  msg.innerHTML=`<div class="spinner"></div>`;
  try{
    const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,brands,nutriments,serving_quantity`);
    const j=await r.json();
    if(j.status!==1||!j.product){msg.textContent='Product not found. Try “Custom food” to add it yourself.';return;}
    const p=j.product,n=p.nutriments||{};

function fileToB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file);});}
async function analyzePhoto(file,meal){
  const key=store.get('aiKey',''),model=store.get('aiModel','claude-haiku-4-5');
  const sheet=el(`<div class="sheet"><div class="sheet-grab"></div>
    <div class="sheet-head"><h3 style="flex:1">Reading your plate…</h3><button class="icon-btn" id="cls">✕</button></div>
    <div class="sheet-body" id="pb"><div class="spinner"></div><div class="muted" style="text-align:center;font-size:13px">Identifying South Indian foods and estimating portions</div></div></div>`);
  sheet.querySelector('#cls').onclick=closeSheet;openSheet(sheet);
  const pb=sheet.querySelector('#pb');
  try{
    const b64=await fileToB64(file);
    const prompt=`You are a South Indian nutrition expert. Identify each distinct food in this meal photo. For each, estimate the portion in grams and its nutrition. Reply with ONLY a JSON array, no prose, like: [{"name":"Idli","grams":80,"kcal":104,"protein":3,"carbs":22,"fat":0.4,"fibre":1,"emoji":"🍥"}]. Use common South Indian dish names.`;
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model,max_tokens:1024,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:file.type||'image/jpeg',data:b64}},{type:'text',text:prompt}]}]})});
    if(!r.ok){const t=await r.text();throw new Error(r.status+' '+t.slice(0,120));}
    const data=await r.json();
    const txt=(data.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('');
    const arr=JSON.parse(txt.slice(txt.indexOf('['),txt.lastIndexOf(']')+1));
    pb.innerHTML='';pb.appendChild(el(`<div class="muted" style="font-size:13px;padding:4px 4px 10px">Tap items to add them to ${meal}. Adjust after if needed.</div>`));
    arr.forEach(a=>{
      const food={id:'ai:'+Date.now()+Math.random(),name:a.name||'Food',cat:'Detected',
        per100:mkPer100(scaleTo100(a)),unit:'pack',gPerUnit:a.grams||100,emoji:a.emoji||'🍽️',aliases:[],transient:true};
      const dp=[a.name,a.grams||100];const row=el(`<div class="food-row"><div class="food-emoji">${food.emoji}</div>
        <div class="fr-t"><b>${food.name}</b><small>~${fmt(a.grams||100)} g · ${fmt(a.protein||0)}g protein</small></div>
        <div class="fr-k"><b>${fmt(a.kcal||0)}</b><br><span class="muted" style="font-size:11px">kcal</span></div></div>`);
      row.onclick=()=>openPortionSheet(food,meal);pb.appendChild(row);});
    if(!arr.length)pb.appendChild(el(`<div class="empty">No foods detected. Try a clearer photo.</div>`));
  }catch(e){
    pb.innerHTML=`<div class="empty"><div class="e-emoji">⚠️</div>Couldn't analyse the photo.<br><span style="font-size:12px">${(e.message||'').includes('401')?'API key rejected — check it in Profile → AI.':'Check your connection & key, then try again.'}</span></div>`;
  }
}
function scaleTo100(a){const g=a.grams||100,k=100/g;return {kcal:(a.kcal||0)*k,p:(a.protein||0)*k,c:(a.carbs||0)*k,f:(a.fat||0)*k,fib:(a.fibre||a.fiber||0)*k};}

  const labels=[],cals=[],targets=[];let logged=0,cheat=0,sum=0,sp=0;
  for(let i=6;i>=0;i--){const dt=new Date(Date.now()-i*864e5),k=todayKey(dt);labels.push(dt.toLocaleDateString('en-IN',{weekday:'short'}));
    const dd=days[k],kc=dd?dd.log.reduce((a,x)=>a+x.m.kcal,0):0,pr=dd?dd.log.reduce((a,x)=>a+x.m.p,0):0;cals.push(kc);
    const tgt=calcGoals(state.profile,dd&&dd.type==='rest'?'rest':'train').cal;targets.push(tgt);
    if(kc>0){logged++;sum+=kc;sp+=pr;if(kc>tgt*1.15)cheat++;}}
  const max=Math.max(g.cal,...cals,1);
  const bars=labels.map((l,i)=>{const h=cals[i]/max*100,over=cals[i]>targets[i];
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px"><div style="flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center">
      <div style="width:60%;height:${Math.max(2,h)}%;border-radius:8px 8px 4px 4px;background:${over?'var(--clay)':'var(--amber)'};transition:height .6s"></div></div><small class="muted" style="font-size:11px">${l}</small></div>`;}).join('');
  scr.appendChild(el(`<div class="chart-card"><div class="card-title">Calories · last 7 days</div>
    <div style="position:relative;height:150px;display:flex;gap:6px;border-bottom:1px solid var(--outline)">
      <div style="position:absolute;left:0;right:0;bottom:${g.cal/max*100}%;border-top:2px dashed var(--green);opacity:.6"></div>${bars}</div>
    <div class="legend"><span><i style="background:var(--amber)"></i>On/under</span><span><i style="background:var(--clay)"></i>Over</span><span><i style="background:var(--green)"></i>Goal ${fmt(g.cal)}</span></div></div>`));
  const wh=weightHistory();
  if(wh.length>1)scr.appendChild(el(`<div class="chart-card"><div class="card-title">Weight trend</div>${lineChart(wh.map(x=>x.w),wh.map(x=>new Date(x.d).toLocaleDateString('en-IN',{day:'numeric',month:'short'})))}</div>`));
  const avgCal=logged?sum/logged:0,avgP=logged?sp/logged:0;let score=0;
  if(logged){const calScore=100-Math.min(100,Math.abs(avgCal-g.cal)/g.cal*200),pScore=Math.min(100,avgP/g.protein*100),consist=logged/7*100;score=Math.round(calScore*0.35+pScore*0.35+consist*0.30);}
  scr.appendChild(el(`<div class="chart-card"><div class="card-title">Nutrition score</div>
    <div style="display:flex;align-items:center;gap:20px"><div class="ring-wrap">${ringSVG(score/100,110,score>75?'var(--green)':score>50?'var(--gold)':'var(--clay)',12)}
      <div class="center"><div class="ring-num">${score}</div><div class="ring-lbl">/ 100</div></div></div>
      <div class="muted" style="flex:1;font-size:13px">${score>75?'Excellent consistency and protein 💪':score>50?'Good — aim for steadier calories':logged?'Keep logging to build the habit':'No data yet this week'}</div></div></div>`));
  const ws=el(`<div class="chart-card"><div class="card-title">This week</div></div>`);
  [['Average calories',logged?fmt(avgCal)+' kcal':'—'],['Average protein',logged?fmt(avgP)+' g':'—'],['Days logged',logged+' / 7'],['Cheat days',cheat],['Workout days','—']].forEach(([k,v],i,a)=>ws.appendChild(el(`<div class="wk-stat" ${i===a.length-1?'style="border:none"':''}><span>${k}</span><b>${v}</b></div>`)));
  scr.appendChild(ws);
}
function lineChart(vals,labels){const w=280,h=110,pad=10,min=Math.min(...vals),max=Math.max(...vals),rng=(max-min)||1;
  const pts=vals.map((v,i)=>{const x=pad+i*(w-2*pad)/((vals.length-1)||1),y=h-pad-(v-min)/rng*(h-2*pad);return[x,y];});
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const dots=pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--amber)"/>`).join('');
  return `<svg viewBox="0 0 ${w} ${h+18}" style="width:100%"><path d="${path}" fill="none" stroke="var(--amber)" stroke-width="2.5" stroke-linejoin="round"/>${dots}
    ${pts.map((p,i)=>`<text x="${p[0]}" y="${h+12}" font-size="9" fill="var(--on-muted)" text-anchor="middle">${labels[i]}</text>`).join('')}
    <text x="${pts[0][0]}" y="${pts[0][1]-7}" font-size="10" fill="var(--on-muted)">${vals[0]}</text>
    <text x="${pts[pts.length-1][0]}" y="${pts[pts.length-1][1]-7}" font-size="10" fill="var(--on-muted)" text-anchor="end">${vals[vals.length-1]}</text></svg>`;}

/* ---------------- PROFILE ---------------- */
function renderProfile(scr){
  const p=state.profile,g=calcGoals(p),gr=calcGoals(p,'rest');
  scr.appendChild(el(`<div class="goal-card"><div class="ring-lbl">Your daily target</div><div class="big">${fmt(g.cal)}</div>
    <div class="muted" style="font-size:13px">kcal · P ${g.protein}g · C ${g.carbs}g · F ${g.fat}g</div>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:12px">
      <div class="pill" style="background:var(--amber-c);color:var(--amber)">🏋️ Training ${fmt(g.cal)}</div>
      <div class="pill">😴 Rest ${fmt(gr.cal)}</div></div>
    <div class="muted" style="margin-top:10px;font-size:12px">BMR ${fmt(g.bmr)} · Maintenance ${fmt(g.tdee)} kcal</div></div>`));
  const card=el(`<div class="card" style="margin:0"><div class="card-title">Your details</div></div>`);
  [['Goal',{maintain:'Maintenance',recomp:'Recomposition',fatloss:'Fat Loss Focus',muscle:'Build Muscle',custom:'Custom'}[p.goal]],['Age',p.age+' yrs'],['Gender',p.gender],['Height',p.height+' cm'],['Weight',p.weight+' kg'],['Activity',{1.2:'Sedentary',1.375:'Light',1.55:'Moderate',1.725:'Active',1.9:'Very active'}[p.activity]]]
    .forEach(([k,v],i,a)=>card.appendChild(el(`<div class="wk-stat" ${i===a.length-1?'style="border:none"':''}><span class="muted">${k}</span><b style="text-transform:capitalize">${v}</b></div>`)));
  scr.appendChild(card);

  const pc=el(`<div class="card" style="margin:12px 0 0"><div class="card-title">Profile</div>
    <div class="row-between" style="padding:6px 0"><span class="muted">Signed in as</span><b>${profileLabel(activeProfileId)}</b></div>
    ${isFirebaseConfigured?`<div class="row-between" style="padding:6px 0"><span class="muted">Cloud sync</span><b id="syncLbl" style="font-weight:600;font-size:13px">…</b></div>
    <button class="btn btn-tonal" id="syncNowBtn" style="margin-top:4px">🔄 Sync now</button>`:''}
    <button class="btn btn-tonal" id="swp" style="margin-top:6px">🔁 Switch to ${profileLabel(PROFILES.find(x=>x.id!==activeProfileId).id)}</button></div>`);
  pc.querySelector('#swp').onclick=()=>{const other=PROFILES.find(x=>x.id!==activeProfileId).id;confirmSheet(`Switch to ${profileLabel(other)}'s profile?`,()=>switchProfile(other),{confirmLabel:'Switch'});};
  if(isFirebaseConfigured){
    const st=syncStatus(profileKeyPrefix(activeProfileId));
    const lbl=pc.querySelector('#syncLbl');
    lbl.textContent=!st.online?'📴 Offline':st.pending?'⏳ Syncing…':st.lastSyncedAt?`🔄 Synced ${timeAgo(st.lastSyncedAt)}`:'⏳ Not synced yet';
    const syncBtn=pc.querySelector('#syncNowBtn');
    syncBtn.onclick=async()=>{
      haptic();syncBtn.disabled=true;syncBtn.textContent='⏳ Syncing…';
      const ok=await syncNow(activeProfileId,profileKeyPrefix(activeProfileId));
      resyncStateFromStore();
      toast(ok?'Synced ✅':"Couldn't sync — check your connection");
      render();
    };
  }
  scr.appendChild(pc);

  const sc=el(`<div class="card" style="margin:12px 0 0"><div class="card-title">Storage</div><div id="scBody" class="muted" style="font-size:13px">Checking…</div></div>`);
  storageStatus().then(s=>{const b=sc.querySelector('#scBody');const mb=s.usage!=null?' · '+(s.usage/1048576).toFixed(2)+' MB used':'';
    if(s.ok){b.innerHTML=`✅ Saved on this device${s.persisted?' · <b style="color:var(--green)">persistent</b>':''}${mb}<br><span style="font-size:11.5px">Your log stays even after you close, restart or update the app.</span>`;
      if(!s.persisted){const btn=el(`<button class="link" style="margin-top:8px">Enable persistent storage</button>`);btn.onclick=()=>{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().then(ok=>{toast(ok?'Persistent storage enabled':'Browser will keep data based on usage');render();});};b.appendChild(document.createElement('br'));b.appendChild(btn);}
    } else {b.innerHTML=`⚠️ This browser is blocking storage (often Private/Incognito mode). Data won't persist. Switch to a normal window or install Sappadu to your home screen.`;}});
  scr.appendChild(sc);
  const btns=el(`<div style="padding:16px 0;display:flex;flex-direction:column;gap:10px">
    <button class="btn btn-tonal" id="edit">✏️ Edit goals & details</button>
    <button class="btn btn-tonal" id="notif">🔔 Reminders</button>
    <button class="btn btn-tonal" id="ai">📸 AI photo settings</button>
    <button class="btn btn-tonal" id="integ">⌚ Connect health apps</button>
    <button class="btn btn-tonal" id="export">⬇️ Export data</button>
    <button class="btn btn-tonal" id="import">⬆️ Import data</button>
    <button class="btn btn-tonal" id="reset" style="color:var(--clay)">Reset all data</button></div>`);
  btns.querySelector('#edit').onclick=()=>{state.profile=null;render();};
  btns.querySelector('#notif').onclick=openReminders;
  btns.querySelector('#ai').onclick=openAISettings;
  btns.querySelector('#integ').onclick=()=>toast('Health app sync ships in the native build.');
  btns.querySelector('#export').onclick=()=>{const data={profile:state.profile,days:store.get('days',{}),weights:weightHistory(),customFoods:customFoods(),favs:state.favs,freq:state.freq,recent:state.recent};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sappadu-backup.json';a.click();toast('Backup downloaded');};
  btns.querySelector('#import').onclick=()=>{const inp=document.createElement('input');inp.type='file';inp.accept='application/json';
    inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);
      if(d.profile){store.set('profile',d.profile);state.profile=d.profile;}if(d.days)store.set('days',d.days);if(d.weights)store.set('weights',d.weights);
      if(d.customFoods)store.set('customFoods',d.customFoods);if(d.favs){store.set('favs',d.favs);state.favs=d.favs;}if(d.freq){store.set('freq',d.freq);state.freq=d.freq;}if(d.recent){store.set('recent',d.recent);state.recent=d.recent;}
      toast('Data restored');render();}catch(e){toast('Invalid backup file');}};r.readAsText(f);};inp.click();};
  btns.querySelector('#reset').onclick=()=>{confirmSheet(`Delete ${profileLabel(activeProfileId)}'s logged data and start over? This won't affect ${profileLabel(PROFILES.find(x=>x.id!==activeProfileId).id)}'s data.`,()=>{
    const prefix=profileKeyPrefix(activeProfileId);
    try{Object.keys(localStorage).filter(k=>k.startsWith(prefix)).forEach(k=>localStorage.removeItem(k));}catch(e){}
    location.reload();});};
  scr.appendChild(btns);
  scr.appendChild(el(`<div class="muted" style="text-align:center;font-size:11px;padding:8px 20px 20px">Sappadu · Works offline · Data stays on your device.<br>Nutrition values are approximate references for South Indian foods.</div>`));
}
function openReminders(){

  sheet.querySelector('#cls').onclick=closeSheet;const rb=sheet.querySelector('#rb');
  [['protein','🥚 Protein reminder','Nudge if protein is low by evening'],['water','💧 Water reminder','Every 2 hours'],['meal','🍽️ Meal reminder','Breakfast, lunch, dinner'],['weight','⚖️ Weight reminder','Weekly weigh-in']].forEach(([k,t,s])=>{

/* ---------------- ONBOARDING ---------------- */
function renderOnboarding(){
  const p=state.profile||{goal:'maintain',gender:'male',age:25,height:170,weight:70,activity:1.55};
  document.documentElement.setAttribute('data-theme',state.theme);app.innerHTML='';
  const wrap=el(`<div class="screen" style="padding-top:calc(env(safe-area-inset-top) + 20px)">
    <div class="brand" style="justify-content:center;margin-bottom:6px"><div class="brand-mark" style="width:52px;height:52px"></div></div>
    <h2 style="text-align:center;font-size:24px">Sappadu</h2>
    <p class="muted" style="text-align:center;margin:6px 0 18px;font-size:14px">Track calories & macros the South Indian way. Let's set your goal.</p></div>`);
  const form=el(`<div></div>`);
  const GOAL_DESC={
    maintain:'Steady calories at maintenance — no cut, no surplus.',
    recomp:'Lose fat and build muscle at the same time. Best default if you’re newer to training — a mild deficit, not an aggressive cut.',
    fatloss:'Prioritizes fat loss with a real, sustainable deficit.',
    muscle:'Prioritizes strength and size with a lean surplus.',
    custom:'Set your own daily calorie target.',
  };
  const goalField=el(`<div class="field"><label>Goal</label><div class="chip-select" id="goal"></div>
    <p class="muted" id="goalDesc" style="font-size:12.5px;margin:8px 2px 0">${GOAL_DESC[p.goal]||''}</p></div>`);
  [['maintain','Maintenance'],['recomp','Recomposition'],['fatloss','Fat Loss Focus'],['muscle','Build Muscle'],['custom','Custom']].forEach(([v,l])=>{
    const b=el(`<button class="${p.goal===v?'on':''}">${l}</button>`);b.onclick=()=>{haptic();p.goal=v;goalField.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
      goalField.querySelector('#goalDesc').textContent=GOAL_DESC[v]||'';customField.classList.toggle('hide',v!=='custom');updatePreview();};goalField.querySelector('#goal').appendChild(b);});
  form.appendChild(goalField);
  const customField=el(`<div class="field ${p.goal==='custom'?'':'hide'}"><label>Custom daily calories</label><input id="customCal" inputmode="numeric" placeholder="e.g. 2000" value="${p.customCal||''}"></div>`);
  customField.querySelector('#customCal').oninput=e=>{p.customCal=parseInt(e.target.value)||0;updatePreview();};form.appendChild(customField);
  let diet=dietPref();
  const dietField=el(`<div class="field"><label>Food preference</label>
    <div class="seg" id="dietSeg">
      <button class="${diet==='veg'?'on':''}" data-d="veg">🟢 Veg</button>
      <button class="${diet==='egg'?'on':''}" data-d="egg">🥚 +Egg</button>
      <button class="${diet==='all'?'on':''}" data-d="all">🍗 All</button>
    </div>
    <p class="muted" style="font-size:12.5px;margin:8px 2px 0">Used to filter food search and suggestions — including auto-fill, which only ever picks from foods matching this.</p></div>`);
  dietField.querySelectorAll('#dietSeg button').forEach(b=>{b.onclick=()=>{haptic();diet=b.dataset.d;store.set('dietPref',diet);
    dietField.querySelectorAll('#dietSeg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');};});
  form.appendChild(dietField);
  const gf=el(`<div class="field"><label>Gender</label><div class="chip-select" id="gen"></div></div>`);
  [['male','Male'],['female','Female']].forEach(([v,l])=>{const b=el(`<button class="${p.gender===v?'on':''}">${l}</button>`);b.onclick=()=>{haptic();p.gender=v;gf.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');updatePreview();};gf.querySelector('#gen').appendChild(b);});
  form.appendChild(gf);
  const numRow=el(`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
    <div class="field" style="margin:14px 0"><label>Age</label><input id="age" inputmode="numeric" value="${p.age}"></div>
    <div class="field" style="margin:14px 0"><label>Height cm</label><input id="height" inputmode="numeric" value="${p.height}"></div>
    <div class="field" style="margin:14px 0"><label>Weight kg</label><input id="weight" inputmode="decimal" value="${p.weight}"></div></div>`);
  numRow.querySelector('#age').oninput=e=>{p.age=+e.target.value;updatePreview();};
  numRow.querySelector('#height').oninput=e=>{p.height=+e.target.value;updatePreview();};
  numRow.querySelector('#weight').oninput=e=>{p.weight=+e.target.value;updatePreview();};form.appendChild(numRow);
  const af=el(`<div class="field"><label>Activity level</label><select id="act">
    <option value="1.2">Sedentary — desk job, little exercise</option>
    <option value="1.375">Light — 1–3 workouts / week</option>
    <option value="1.55">Moderate — 3–5 workouts / week</option>
    <option value="1.725">Active — 6–7 workouts / week</option>
    <option value="1.9">Very active — hard training / physical job</option></select></div>`);
  af.querySelector('#act').value=p.activity;af.querySelector('#act').onchange=e=>{p.activity=+e.target.value;updatePreview();};form.appendChild(af);
  const preview=el(`<div class="goal-card"><div class="ring-lbl">Estimated daily target</div><div class="big" id="pvCal">—</div><div class="muted" id="pvMac" style="font-size:13px"></div></div>`);form.appendChild(preview);
  function updatePreview(){if(p.age&&p.height&&p.weight){const g=calcGoals(p);preview.querySelector('#pvCal').textContent=fmt(g.cal);preview.querySelector('#pvMac').textContent=`P ${g.protein}g · C ${g.carbs}g · F ${g.fat}g · Mifflin–St Jeor`;}}
  updatePreview();
  const save=el(`<button class="btn btn-primary" style="margin:8px 4px 30px">Start tracking →</button>`);
  save.onclick=()=>{if(!p.age||!p.height||!p.weight){toast('Please fill age, height and weight');return;}
    p.activity=+p.activity;state.profile=p;store.set('profile',p);const h=weightHistory();if(!h.length){h.push({d:todayKey(),w:p.weight});store.set('weights',h);}
    state.tab='home';render();};
  form.appendChild(save);wrap.appendChild(form);app.appendChild(wrap);
}

/* ---------------- Install prompt ---------------- */
let installReady=false,deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installReady=true;if(state.profile&&state.tab==='home')render();});
['online','offline'].forEach(ev=>window.addEventListener(ev,()=>{if(state.profile&&state.tab==='profile')render();}));
function installBanner(){
  const b=el(`<div class="install-banner"><div style="font-size:22px">📲</div>
    <div class="ib-t"><b>Install Sappadu</b><div class="muted">Add to home screen for full-screen, offline use</div></div>
    <button class="btn btn-primary" id="ins" style="width:auto;padding:10px 16px;font-size:14px">Install</button>
    <button class="icon-btn" id="dis" style="width:32px;height:32px;font-size:15px;box-shadow:none">✕</button></div>`);
  b.querySelector('#ins').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installReady=false;render();}};
  b.querySelector('#dis').onclick=()=>{store.set('installDismiss',true);render();};
  return b;
}

// Re-reads the fields `state` cached at parse time — needed after a cloud
// pull may have overwritten localStorage out from under that initial read.
function resyncStateFromStore(){
  state.profile=store.get('profile',null);
  state.theme=store.get('theme','light');
  state.recent=store.get('recent',[]);
  state.favs=store.get('favs',[]);
  state.freq=store.get('freq',{});
}

if(!activeProfileId){
  renderIdentityPicker();
}else{
  initStorage();
  migrateWaterToMl();
  (async()=>{
    if(isFirebaseConfigured){
      // Race the pull against a timeout so a slow/broken connection never blocks
      // first paint — worst case we render local data and sync catches up later.
      const prefix=profileKeyPrefix(activeProfileId);
      await Promise.race([pullProfile(activeProfileId,prefix), new Promise(r=>setTimeout(r,2500))]);
      migrateWaterToMl();
      migrateGoalScheme();
      resyncStateFromStore();
      watchProfile(activeProfileId,prefix);
    }
    render();
    if('serviceWorker'in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
  })();
}
</script>
